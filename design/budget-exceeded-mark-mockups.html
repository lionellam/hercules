<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Budget Exceeded Mark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --page: #ececea; --page-text: #18181b; --page-muted: #5f5f66; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--page); color: var(--page-text); font-family: Inter, -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  main { max-width: 1460px; margin: 0 auto; padding: 36px 16px 80px; }
  h1 { font-size: 28px; letter-spacing: -0.02em; margin: 0 0 8px; }
  h2 { font-size: 18px; margin: 40px 0 6px; }
  .lead { color: var(--page-muted); max-width: 900px; line-height: 1.55; margin: 0 0 10px; font-size: 15px; }
  .lead b { color: var(--page-text); }
  .frames { display: flex; flex-wrap: wrap; gap: 26px; align-items: flex-start; margin-top: 16px; }
  figure { margin: 0; max-width: 100%; }
  figcaption { max-width: 375px; font-size: 13px; color: var(--page-muted); margin-top: 10px; line-height: 1.5; }
  figcaption b { color: var(--page-text); }
  .card { width: 375px; max-width: 100%; border-radius: 18px; overflow: hidden; border: 1px solid rgba(0,0,0,.08); box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 10px 28px rgba(0,0,0,.08); }

  /* App tokens, from web/app/globals.css */
  .app { --bg: #fff; --text: #18181b; --muted: #71717a; --soft: #f4f4f5; --bar: #18181b; --bad: #b91c1c; --warn: #d97706; --warn-text: #b45309;
         background: var(--bg); color: var(--text); font-size: 15px; padding: 18px 20px 22px; }
  .app.dark { --bg: #18181b; --text: #f4f4f5; --muted: #a1a1aa; --soft: #27272a; --bar: #f4f4f5; --bad: #f87171; --warn: #f59e0b; --warn-text: #fbbf24; }
  .label { color: var(--muted); font-size: 13px; font-weight: 600; letter-spacing: .04em; }
  .cat { margin-top: 18px; }
  .cat-top { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; margin-bottom: 6px; }
  .cat-top .n { color: var(--muted); font-size: 12px; margin-left: 6px; }
  .of { color: var(--muted); font-weight: 400; }
  .track { height: 6px; background: var(--soft); border-radius: 3px; overflow: hidden; }
  .fill { height: 100%; border-radius: 3px; }
  .fill.warn { background: var(--warn); } .fill.over { background: var(--bad); }
  .note { margin-top: 6px; font-size: 12.5px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .note.warn { color: var(--warn-text); } .note.over { color: var(--bad); }
  .new { outline: 2px dashed #1d4ed8; outline-offset: 2px; border-radius: 3px; }
  /* A: a bold "!" */
  .ma { font-weight: 800; font-size: 13.5px; width: 8px; text-align: center; }
  /* B: "!" in an outlined circle, like the "i" in the Budget not set pill */
  .mb { display: grid; place-items: center; width: 15px; height: 15px; border-radius: 50%; border: 1.4px solid currentColor; font-size: 10px; font-weight: 800; line-height: 1; flex-shrink: 0; }
  /* C: "!" in a filled circle */
  .mc { display: grid; place-items: center; width: 15px; height: 15px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
  .mc span { color: var(--bg); font-size: 10px; font-weight: 800; line-height: 1; }
</style>
</head>
<body>
<main>
  <h1>Budget exceeded: a "!" before the note</h1>
  <p class="lead">On the Log screen, under <b>Today by category</b>, a "!" in the note's own colour goes to the left of <b>Daily budget exceeded</b> (amber) and <b>Monthly budget exceeded</b> (red). Three styles, each in the dark and light themes. Dashed blue outlines mark what's new.</p>
  <div id="out"></div>
</main>
<script>
  const marks = {
    A: ['<span class="ma new" aria-hidden="true">!</span>', '<b>A: a bold "!".</b> The lightest touch: just the character, in the note\'s colour.'],
    B: ['<span class="mb new" aria-hidden="true">!</span>', '<b>B: "!" in an outlined circle.</b> The same shape as the "i" in the "Budget not set" pill, so the marks look like one family.'],
    C: ['<span class="mc new" aria-hidden="true"><span>!</span></span>', '<b>C (recommended): "!" in a filled circle.</b> The clearest at a glance, and reads as a warning rather than information, so it isn\'t mistaken for the tappable "i".'],
  };
  const card = (m, dark) => `<div class="card"><div class="app${dark ? ' dark' : ''}">
    <div class="label">TODAY BY CATEGORY</div>
    <div class="cat"><div class="cat-top"><span>Food &amp; Dining<span class="n">4</span></span><span><strong>42.60</strong> <span class="of">of 38.25</span></span></div>
      <div class="track"><div class="fill warn" style="width:100%"></div></div><p class="note warn">${m}Daily budget exceeded</p></div>
    <div class="cat"><div class="cat-top"><span>Transport<span class="n">1</span></span><strong>4.62</strong></div>
      <div class="track"><div class="fill over" style="width:100%"></div></div><p class="note over">${m}Monthly budget exceeded</p></div>
  </div></div>`;
  document.getElementById('out').innerHTML = Object.entries(marks).map(([k, [m, cap]]) =>
    `<h2>Option ${k}</h2><div class="frames"><figure>${card(m, true)}<figcaption>${cap} Dark theme.</figcaption></figure><figure>${card(m, false)}<figcaption>Light theme.</figcaption></figure></div>`).join('');
</script>
</body>
</html>
