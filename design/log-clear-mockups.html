<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log Box Clear Button</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --page: #ececea; --page-text: #18181b; --page-muted: #5f5f66; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--page); color: var(--page-text); font-family: Inter, -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  main { max-width: 1260px; margin: 0 auto; padding: 36px 16px 80px; }
  h1 { font-size: 28px; letter-spacing: -0.02em; margin: 0 0 8px; }
  .intro p { color: var(--page-muted); max-width: 800px; line-height: 1.55; margin: 0 0 10px; font-size: 15px; }
  .frames { display: flex; flex-wrap: wrap; gap: 30px 26px; align-items: flex-start; margin-top: 28px; }
  figure { margin: 0; max-width: 100%; }
  figcaption { max-width: 340px; font-size: 13px; color: var(--page-muted); margin-top: 12px; line-height: 1.5; }
  figcaption b { color: var(--page-text); }
  .phone { width: 340px; max-width: 100%; height: 640px; border-radius: 30px; overflow: hidden; border: 1px solid rgba(0,0,0,.08);
           box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 10px 28px rgba(0,0,0,.08); }

  /* App tokens and styles, from web/app/globals.css */
  .app { --bg: #fff; --surface: #fff; --text: #18181b; --muted: #71717a; --line: #e7e7e4; --accent: #18181b; --accent-text: #fff; --soft: #f4f4f5;
         background: var(--bg); color: var(--text); font-size: 15px; position: relative; height: 100%; display: flex; flex-direction: column; }
  .app.dark { --bg: #18181b; --surface: #18181b; --text: #f4f4f5; --muted: #a1a1aa; --line: #27272a; --accent: #f4f4f5; --accent-text: #18181b; --soft: #27272a; }
  .app .top { padding: 30px 20px 16px; border-bottom: 1px solid var(--line); }
  .app .greet { color: var(--muted); font-size: 14px; }
  .app h3 { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
  .app .input-wrap { background: var(--soft); border-radius: 16px; padding: 14px; margin-top: 14px; position: relative; }
  .app .txt { font-size: 17px; min-height: 56px; line-height: 1.35; padding-right: 34px; }
  .app .txt.ph { color: var(--muted); }
  .app .txt .caret { display: inline-block; width: 1.5px; height: 19px; background: var(--text); vertical-align: -3px; margin-left: 1px; }
  .app .row { display: flex; justify-content: flex-end; }
  .app .btn { height: 38px; padding: 0 18px; border-radius: 12px; border: none; font: inherit; font-size: 15px; font-weight: 600; background: var(--accent); color: var(--accent-text); }
  .app .btn.dim { opacity: .35; }
  .app .clear { position: absolute; top: 8px; right: 8px; width: 36px; height: 36px; display: grid; place-items: center; outline: 2px dashed #1d4ed8; outline-offset: -2px; border-radius: 50%; }
  .app .clear span { width: 22px; height: 22px; border-radius: 50%; background: var(--muted); color: var(--bg); display: grid; place-items: center; font-size: 15px; font-weight: 700; line-height: 1; }
  .app .today-total { display: flex; justify-content: space-between; margin-top: 12px; color: var(--muted); font-size: 14px; }
  .app .today-total strong { color: var(--text); font-size: 16px; }
  .app .body { padding: 0 20px; flex: 1; }
  .app .label { color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; margin-top: 18px; }
  .app .item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .app .item .m { font-weight: 500; }
  .app .item .c { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .app .item .a { font-weight: 600; font-variant-numeric: tabular-nums; }
  .app .tabbar { display: flex; border-top: 1px solid var(--line); padding: 8px 0 18px; }
  .app .tabbar span { flex: 1; text-align: center; font-size: 11px; color: var(--muted); }
  .app .tabbar span i { display: block; font-style: normal; font-size: 17px; margin-bottom: 2px; }
  .app .tabbar span.on { color: var(--text); font-weight: 600; }
</style>
</head>
<body>
<main>
  <div class="intro">
    <h1>Clearing the Log box</h1>
    <p>An "×" at the top right of the box on the Log screen clears what you've typed in one tap. It appears only when there's text, like the × in History search. Nothing is asked first; it's only typed text. The dashed blue ring marks the new button.</p>
  </div>
  <div class="frames" id="frames"></div>
</main>
<script>
const screen = (text, dark = false) => `<div class="phone"><div class="app ${dark ? "dark" : ""}">
  <div class="top"><div class="greet">Monday, 9 November</div><h3>Log an expense</h3>
    <div class="input-wrap">
      <div class="txt ${text ? "" : "ph"}">${text ? text + '<span class="caret"></span>' : "e.g. Lunch at LJS for $4.50 yesterday"}</div>
      ${text ? '<div class="clear"><span>×</span></div>' : ""}
      <div class="row"><button class="btn ${text ? "" : "dim"}">Parse</button></div>
    </div>
    <div class="today-total"><span>Spent today</span><strong>$13.00</strong></div>
  </div>
  <div class="body"><div class="label">Today</div>
    <div class="item"><div><div class="m">Starbucks</div><div class="c">Food &amp; Dining</div></div><div class="a">7.80</div></div>
    <div class="item"><div><div class="m">Ya Kun</div><div class="c">Food &amp; Dining</div></div><div class="a">5.20</div></div>
  </div>
  <div class="tabbar"><span class="on"><i>+</i>Log</span><span><i>≡</i>History</span><span><i>▮</i>Summary</span><span><i>◇</i>Categories</span></div>
</div></div>`;
const fig = (inner, cap) => `<figure>${inner}<figcaption>${cap}</figcaption></figure>`;
document.getElementById("frames").innerHTML = [
  fig(screen(""), "<b>1. Empty box.</b> No × until you start typing."),
  fig(screen("dinner at jumbo seafood with the family 186.40 yesterday"), "<b>2. With text.</b> The × sits at the top right of the box, clear of the text and the Parse button. Tap it to empty the box."),
  fig(screen("dinner at jumbo seafood with the family 186.40 yesterday", true), "<b>3. Dark mode.</b> The same, in the dark theme."),
].join("");
</script>
</body>
</html>
